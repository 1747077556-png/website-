<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品集网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff;
            color: #333;
            transition: 0.3s;
        }

        .dark {
            background: #1a1a1a;
            color: #fff;
        }

        nav {
            display: flex;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: #f5f5f5;
        }

        .dark nav {
            background: #222;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        a {
            text-decoration: none;
            color: #2563eb;
        }

        .hero {
            padding: 3rem 2rem;
            text-align: center;
        }

        button {
            padding: 0.6rem 1.2rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 1rem;
        }

        section {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        input, textarea {
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .dark input, .dark textarea {
            background: #333;
            color: white;
            border-color: #555;
        }
    </style>
</head>

<body>
    <nav>
        <h2>MyPortfolio</h2>
        <ul class="nav-links">
            <li><a href="#home">首页</a></li>
            <li><a href="#about">关于我</a></li>
            <li><a href="#contact">联系我</a></li>
        </ul>
        <button onclick="toggleDark()">切换深色模式</button>
    </nav>

    <section id="home" class="hero">
        <h1>你好，我是网页开发者</h1>
        <p>这是我的作业网站，支持深色模式和表单验证</p>
    </section>

    <section id="about">
        <h2>关于我</h2>
        <p>学习HTML、CSS、JavaScript，做响应式网站。</p>
    </section>

    <section id="contact">
        <h2>联系我</h2>
        <form onsubmit="return checkForm()">
            <input type="text" id="name" placeholder="姓名">
            <input type="email" id="email" placeholder="邮箱">
            <textarea rows="4" placeholder="留言"></textarea>
            <button type="submit">发送</button>
        </form>
    </section>

    <script>
        // 深色模式
        function toggleDark() {
            document.body.classList.toggle('dark');
        }

        // 表单验证
        function checkForm() {
            let name = document.getElementById('name').value;
            if (name.length < 2) {
                alert('姓名至少2个字符');
                return false;
            }
            alert('提交成功！');
            return true;
        }
    </script>
</body>
</html>
